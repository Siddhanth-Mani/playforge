<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://generativelanguage.googleapis.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>PlayForge: describe a game, then play it</title>
  <meta name="description" content="Type a sentence like “a racing game in Fiji with 3 laps” and play it in your browser. Pick a car and a map, add missions, share a link, remix other people's games.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <main id="app" aria-live="polite">
    <p class="boot">Loading PlayForge…</p>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="boot">PlayForge needs JavaScript to build and run games.</p></noscript>
</body>
</html>
